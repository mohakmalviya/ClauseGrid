{
  "schema_version": 1,
  "policy_id": "SR-SLA-2026.1",
  "currency": "USD",
  "ambiguity_status": "resolved",
  "rules": [
    {
      "id": "RB-101",
      "title": "Eligible spend",
      "target": "L6",
      "status": "EXACT",
      "boundaries": [],
      "depends_on": [],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 2,
        "start_char": 170,
        "end_char": 286,
        "quote": "Eligible spend equals gross eligible invoices minus returns and credits minus pass-through charges, floored at zero.",
        "quote_sha256": "e843c3f1df0447bf29e685f5d5b5b36dc707860e6d044523c6aaa807075b5314"
      }
    },
    {
      "id": "RB-102",
      "title": "Ordered tier lookup boundaries",
      "target": "N6",
      "status": "EXACT",
      "boundaries": [
        "eligible_spend<100000",
        "eligible_spend<250000",
        "eligible_spend<500000"
      ],
      "depends_on": [
        "RB-101"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 2,
        "start_char": 325,
        "end_char": 552,
        "quote": "The tier schedule is an ordered range lookup: the rebate rate is 0% when eligible spend is below $100,000; 2% from $100,000 inclusive to below $250,000; 3% from $250,000 inclusive to below $500,000; and 4% at $500,000 or above.",
        "quote_sha256": "8c7937be82630b30f96415de81d1d34cc001ba4419ecb718961c60f8a09ef623"
      }
    },
    {
      "id": "RB-103",
      "title": "Gross rebate",
      "target": "O6",
      "status": "EXACT",
      "boundaries": [],
      "depends_on": [
        "RB-101",
        "RB-102"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 2,
        "start_char": 573,
        "end_char": 669,
        "quote": "Gross rebate equals eligible spend multiplied by the rebate rate, with no intermediate rounding.",
        "quote_sha256": "07696948047e1f112239ba5ec631134d2b2f1a604cfe972311aa15aa9c488c1a"
      }
    },
    {
      "id": "RB-201",
      "title": "Critical incident precedence",
      "target": "P6",
      "status": "EXACT",
      "boundaries": [
        "critical_incidents>=1"
      ],
      "depends_on": [],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 3,
        "start_char": 192,
        "end_char": 355,
        "quote": "One or more critical incidents sets the SLA multiplier to zero unless the critical-incident waiver is Y; this exclusion is evaluated before ordinary SLA penalties.",
        "quote_sha256": "aa42fd244942c04d4e4fc4bfff1dc959e33808b2fbb58caab259dbd013555bb4"
      }
    },
    {
      "id": "RB-202",
      "title": "Ordinary SLA penalties",
      "target": "P6",
      "status": "EXACT",
      "boundaries": [
        "on_time_rate<0.95",
        "defect_rate>0.02"
      ],
      "depends_on": [
        "RB-201"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 3,
        "start_char": 386,
        "end_char": 583,
        "quote": "When critical exclusion does not apply, the SLA multiplier is 0.60 if on-time delivery is below 95% and defect rate is above 2%, 0.75 if exactly one of those conditions is true, and 1.00 otherwise.",
        "quote_sha256": "73e31243120810bdf44778810ffb4088061b25aa79c73a1febf5c6598e73bf4f"
      }
    },
    {
      "id": "RB-203",
      "title": "Waiver scope",
      "target": "P6",
      "status": "EXACT",
      "boundaries": [],
      "depends_on": [
        "RB-201",
        "RB-202"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 3,
        "start_char": 604,
        "end_char": 725,
        "quote": "A critical-incident waiver waives only the critical exclusion; it does not waive an ordinary delivery or quality penalty.",
        "quote_sha256": "9bf2c10385b993b8bfcee852c2b5e5ba420b115cc8680acfeaab0ed9fbcfbc6d"
      }
    },
    {
      "id": "RB-204",
      "title": "Contract-effective active days",
      "target": "M6",
      "status": "EXACT",
      "boundaries": [],
      "depends_on": [],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 3,
        "start_char": 764,
        "end_char": 917,
        "quote": "Contract-effective active days are inclusive calendar days from the later of the period start and contract start through the period end, floored at zero.",
        "quote_sha256": "c2550839adccb234262d6e2649e3fd78b55ea7c838eb79d50c1a3d3875242f83"
      }
    },
    {
      "id": "RB-205",
      "title": "Effective-date proration multiplier",
      "target": "Q6",
      "status": "EXACT",
      "boundaries": [
        "active_days/period_days",
        "multiplier<=1"
      ],
      "depends_on": [
        "RB-204"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 3,
        "start_char": 961,
        "end_char": 1139,
        "quote": "The effective-date proration multiplier equals contract-effective active days divided by the inclusive calendar days in the settlement period, capped at 1.00 and floored at zero.",
        "quote_sha256": "f47b3a52bf1469ed4b4df4c734ed9ac3e94fdfb83f0be2d7a65bc65f606a9576"
      }
    },
    {
      "id": "RB-301",
      "title": "Adjustment order",
      "target": "R6",
      "status": "EXACT",
      "boundaries": [],
      "depends_on": [
        "RB-103",
        "RB-201",
        "RB-202",
        "RB-203",
        "RB-205"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 4,
        "start_char": 177,
        "end_char": 298,
        "quote": "Adjusted rebate equals gross rebate multiplied by the SLA multiplier and then by the effective-date proration multiplier.",
        "quote_sha256": "3d79ac236621988324d5b6b138ad1e5062d1adae77f04dbd9d0b9593617aef59"
      }
    },
    {
      "id": "RB-302",
      "title": "Cap and rounding",
      "target": "S6",
      "status": "EXACT",
      "boundaries": [
        "cap=20000",
        "round=2"
      ],
      "depends_on": [
        "RB-301"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 4,
        "start_char": 323,
        "end_char": 467,
        "quote": "The $20,000 cap is applied after all multipliers, and the resulting final rebate is rounded to two decimal places only after the cap is applied.",
        "quote_sha256": "539470b757ba6d77c6816bb8db1ad70b115c76bba673a0eff700f01a308c2ad6"
      }
    },
    {
      "id": "RB-303",
      "title": "Decision code",
      "target": "T6",
      "status": "EXACT",
      "boundaries": [],
      "depends_on": [
        "RB-201",
        "RB-302"
      ],
      "ambiguity_reasons": [],
      "source": {
        "document_sha256": "d52ea5da91e3f63a8d0173eb0e23961879cd68161a2032e4d4aac7e5e6113235",
        "page": 4,
        "start_char": 489,
        "end_char": 639,
        "quote": "Decision code is EXCLUDED_CRITICAL for an unwaived critical incident, NO_REBATE when final rebate is zero for any other reason, and PAYABLE otherwise.",
        "quote_sha256": "83aedf8591a846ea317647112257834c51dede7590b9c5a7f79491fda62a3e3d"
      }
    }
  ],
