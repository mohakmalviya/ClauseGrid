services:
  - type: web
    name: clausegrid
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CLAUSEGRID_API_KEY
        sync: false
      - key: CLAUSEGRID_PROVIDER
        value: qubrid
      - key: CLAUSEGRID_MODEL
        value: deepseek-ai/DeepSeek-V3.2
      - key: CLAUSEGRID_MAX_AUDITS_PER_HOUR
        value: "6"
      - key: CLAUSEGRID_MAX_AUDITS_PER_CLIENT_HOUR
        value: "2"
      - key: CLAUSEGRID_ADMIN_TOKEN
        generateValue: true
